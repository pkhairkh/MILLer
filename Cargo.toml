[workspace]
resolver = "2"
members = [
    "crates/ir",
    "crates/passes",
    "crates/knowledge",
    "crates/lab",
    "crates/bridge",
    "crates/trace",
    "crates/artifacts",
    "crates/report",
    "crates/cli",
    "crates/coreml-proto",
    "crates/coreml-emit",
    "crates/coreml-ffi",
]

[workspace.lints.clippy]
uninlined_format_args = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rmp-serde = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
clap = { version = "4", features = ["derive"] }
zip = "2"
chrono = "0.4"
toml = "0.8"
tempfile = "3"
safetensors = "0.4"
half = "2"
prost = "0.12"
prost-types = "0.12"
prost-build = "0.12"
log = "0.4"
thiserror = "1"

# Internal crates
ane-ir = { path = "crates/ir" }
ane-passes = { path = "crates/passes" }
ane-knowledge = { path = "crates/knowledge" }
ane-lab = { path = "crates/lab" }
ane-bridge = { path = "crates/bridge" }
ane-trace = { path = "crates/trace" }
ane-artifacts = { path = "crates/artifacts" }
ane-report = { path = "crates/report" }
ane-coreml-proto = { path = "crates/coreml-proto" }
ane-coreml-emit = { path = "crates/coreml-emit" }
ane-coreml-ffi = { path = "crates/coreml-ffi" }
