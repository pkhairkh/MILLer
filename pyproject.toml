[project]
name = "miller-python"
version = "0.1.0"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
    "macos_only: tests that require macOS",
    "needs_coremltools: tests that require coremltools",
]

[tool.ruff]
line-length = 120
target-version = "py38"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
